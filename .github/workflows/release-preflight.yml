name: Release Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - backend/cmd/server/VERSION
      - 'docs/releases/**'
  push:
    branches:
      - main
    paths:
      - backend/cmd/server/VERSION
      - 'docs/releases/**'

concurrency:
  group: release-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIGRATION_BASELINE_COMMIT: 0572569c6e0187fd02655bec2d9439e30d9edc04

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Validate candidate, migrations, and repository contracts
        run: |
          VERSION=$(cat backend/cmd/server/VERSION)
          RELEASE_TAG="v${VERSION}"
          bash .github/scripts/validate-release-candidate.sh
          backend/scripts/check-release-migrations-history.sh \
            "$MIGRATION_BASELINE_COMMIT" \
            "$GITHUB_SHA" \
            "$RELEASE_TAG"
          bash .github/scripts/test-release-candidate.sh
          bash .github/scripts/test-pretag-release-gate.sh
          bash .github/scripts/test-release-safety.sh
          backend/scripts/check-release-migrations-test.sh
          deploy/tests/managed-update-assets-test.sh

      - name: Verify Go module graph is already tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build deployer binaries and self-contained bundles
        working-directory: backend
        run: |
          mkdir -p "$RUNNER_TEMP/deployer-dist"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/deployer-dist/sub2api-deployer-linux-amd64" ./cmd/deployer
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/deployer-dist/sub2api-deployer-linux-arm64" ./cmd/deployer
          ../deploy/package-sub2api-deployer-bundles.sh "$RUNNER_TEMP/deployer-dist"

  frontend-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Full frontend release preflight
        run: make test-frontend-release
