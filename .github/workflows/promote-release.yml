name: Promote Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Unpublished fork version to promote (e.g., 0.1.166-ts.4)'
        required: true
        type: string
      main_sha:
        description: 'Exact audited main commit (40 hexadecimal characters)'
        required: true
        type: string

concurrency:
  group: promote-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      candidate_run_id: ${{ steps.verify.outputs.candidate_run_id }}
    steps:
      - name: Checkout exact audited main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.main_sha }}

      - name: Verify candidate and successful pre-tag workflows
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.main_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG_RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
          RELEASE_TAG_CREATION_RULESET_ID: ${{ vars.RELEASE_TAG_CREATION_RULESET_ID }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "main_sha must be an exact 40-character lowercase commit SHA" >&2
            exit 1
          }
          [[ "$WORKFLOW_SHA" == "$EXPECTED_SHA" ]] || {
            echo "Promote workflow was loaded from $WORKFLOW_SHA, expected audited commit $EXPECTED_SHA" >&2
            exit 1
          }
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ts\.[1-9][0-9]*$ ]] || {
            echo "version must use X.Y.Z-ts.N with N >= 1" >&2
            exit 1
          }
          [[ "$RELEASE_TAG_RULESET_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "RELEASE_TAG_RULESET_ID must identify the immutable release tag ruleset" >&2
            exit 1
          }
          [[ "$RELEASE_TAG_CREATION_RULESET_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "RELEASE_TAG_CREATION_RULESET_ID must identify the controlled tag creation ruleset" >&2
            exit 1
          }

          git fetch origin main --tags
          VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          RELEASE_TAG="v${EXPECTED_VERSION}"

          [[ "$VERSION" == "$EXPECTED_VERSION" ]] || {
            echo "VERSION contains $VERSION, expected $EXPECTED_VERSION" >&2
            exit 1
          }
          TAG_EXISTS=$(bash .github/scripts/release-promotion-state.sh \
            inspect "$EXPECTED_SHA" "$EXPECTED_VERSION" refs/remotes/origin/main origin)
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/existing-release.json" >/dev/null || {
              echo "GitHub Release is already published: $RELEASE_TAG" >&2
              exit 1
            }
            [[ "$TAG_EXISTS" == true ]] || {
              echo "Draft release exists without the expected immutable tag" >&2
              exit 1
            }
            echo "Reusing an unpublished draft from an earlier operational attempt"
          fi

          verify_workflow() {
            local workflow="$1"
            local label="$2"
            local run
            run=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$EXPECTED_SHA" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0] | [.id, .head_sha, .conclusion] | @tsv')
            [[ -n "$run" ]] || {
              echo "$label has no successful push run for $EXPECTED_SHA" >&2
              exit 1
            }
            IFS=$'\t' read -r run_id run_sha conclusion <<<"$run"
            [[ "$run_sha" == "$EXPECTED_SHA" && "$conclusion" == "success" ]] || {
              echo "$label evidence is invalid: $run" >&2
              exit 1
            }
            printf '%s\n' "$run_id"
          }

          BACKEND_RUN_ID=$(verify_workflow backend-ci.yml "Backend CI")

          # Job-level assertion (SOP sec 11): the Backend CI run must be either a
          # fully executed all-green run, or an evidence inheritance recorded by
          # the Verify SHA Evidence job (then re-derived independently here;
          # Release Check and Promote judgments never reuse each other).
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}/jobs" \
            -f per_page=100 > "$RUNNER_TEMP/backend-ci-jobs.json"
          jq -e . "$RUNNER_TEMP/backend-ci-jobs.json" >/dev/null \
            || { echo "Backend CI jobs payload is not valid JSON" >&2; exit 1; }
          NON_OK_JOBS=$(jq -r '[.jobs[]? | select(.conclusion != "success" and .conclusion != "skipped")] | length' "$RUNNER_TEMP/backend-ci-jobs.json")
          [[ "$NON_OK_JOBS" == "0" ]] || {
            echo "Backend CI run $BACKEND_RUN_ID has jobs that are neither success nor skipped" >&2
            exit 1
          }
          TEST_CONCLUSION=$(jq -r '[.jobs[]? | select(.name == "test")] | .[0].conclusion // "missing"' "$RUNNER_TEMP/backend-ci-jobs.json")
          EVIDENCE_CONCLUSION=$(jq -r '[.jobs[]? | select(.name == "Verify SHA Evidence")] | .[0].conclusion // "missing"' "$RUNNER_TEMP/backend-ci-jobs.json")
          PARENT_SHA=$(git rev-parse "${EXPECTED_SHA}^" 2>/dev/null || true)
          if [[ "$TEST_CONCLUSION" == "success" ]]; then
            echo "Backend CI executed in full for $EXPECTED_SHA (run $BACKEND_RUN_ID)"
          elif [[ "$TEST_CONCLUSION" == "skipped" && "$EVIDENCE_CONCLUSION" == "success" && -n "$PARENT_SHA" ]]; then
            echo "Backend CI heavy job inherited; re-verifying the evidence chain independently"
            bash .github/scripts/release-evidence.sh classify \
              --parent "$PARENT_SHA" --target "$EXPECTED_SHA" | grep -qx "release-only"
            bash .github/scripts/release-evidence-data.sh \
              --repo "$GITHUB_REPOSITORY" --parent-sha "$PARENT_SHA" \
              --out "$RUNNER_TEMP/evidence-data"
            status=0
            bash .github/scripts/release-evidence.sh decide \
              --data-dir "$RUNNER_TEMP/evidence-data" \
              --target-sha "$EXPECTED_SHA" \
              --parent-sha "$PARENT_SHA" \
              --parent-tree "$(git rev-parse "${PARENT_SHA}^{tree}")" \
              > "$RUNNER_TEMP/evidence-decision.json" || status=$?
            if [[ "$status" -ne 0 && "$status" -ne 3 ]]; then
              echo "Evidence decision errored (status=$status); refusing to promote" >&2
              exit 1
            fi
            [[ -s "$RUNNER_TEMP/evidence-decision.json" ]] || {
              echo "Evidence decision produced no output" >&2
              exit 1
            }
            [[ "$(jq -r '.evidence' "$RUNNER_TEMP/evidence-decision.json")" == "inherit" ]] || {
              echo "Independent evidence re-verification failed: $(cat "$RUNNER_TEMP/evidence-decision.json")" >&2
              exit 1
            }
            echo "Evidence chain independently re-verified (terminal run $(jq -r '.terminal.run_id' "$RUNNER_TEMP/evidence-decision.json"))"
          else
            echo "Backend CI job-level evidence is invalid: test=$TEST_CONCLUSION evidence=$EVIDENCE_CONCLUSION" >&2
            exit 1
          fi
          CANDIDATE_RUN_ID=$(verify_workflow release-preflight.yml "Release Preflight")
          echo "Backend CI passed in run $BACKEND_RUN_ID for $EXPECTED_SHA"
          echo "Release candidate passed in run $CANDIDATE_RUN_ID for $EXPECTED_SHA"
          echo "candidate_run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"
          bash .github/scripts/validate-release-candidate.sh
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${RELEASE_TAG_RULESET_ID}" \
            > "$RUNNER_TEMP/release-tag-immutable-ruleset.json"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${RELEASE_TAG_CREATION_RULESET_ID}" \
            > "$RUNNER_TEMP/release-tag-creation-ruleset.json"
          bash .github/scripts/release-safety.sh \
            verify-rulesets-runtime-json \
            "$RUNNER_TEMP/release-tag-immutable-ruleset.json" \
            "$RUNNER_TEMP/release-tag-creation-ruleset.json"

      - name: Download exact audited candidate
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.verify.outputs.candidate_run_id }}
          name: release-candidate-${{ inputs.main_sha }}
          path: ${{ runner.temp }}/candidate/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate audited bytes before creating tag
        env:
          EXPECTED_SHA: ${{ inputs.main_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          deploy/verify-release-candidate.sh \
            "$RUNNER_TEMP/candidate" "$EXPECTED_VERSION" "$EXPECTED_SHA"
          jq -e \
            --arg expected_sha "$EXPECTED_SHA" \
            --arg promote_blob "$(git rev-parse "$EXPECTED_SHA:.github/workflows/promote-release.yml")" \
            --arg release_blob "$(git rev-parse "$EXPECTED_SHA:.github/workflows/release.yml")" '
              .workflow_commit == $expected_sha
              and .workflow_blobs["promote-release.yml"] == $promote_blob
              and .workflow_blobs["release.yml"] == $release_blob
            ' "$RUNNER_TEMP/candidate/candidate.json" >/dev/null
          CANDIDATE_IMAGE=$(jq -er '.candidate_image' "$RUNNER_TEMP/candidate/candidate.json")
          CANDIDATE_DIGEST=$(jq -er '.image_digest' "$RUNNER_TEMP/candidate/candidate.json")
          bash .github/scripts/release-safety.sh assert-image-digest-matches \
            "$CANDIDATE_IMAGE" "$CANDIDATE_DIGEST"

      - name: Create immutable annotated tag
        if: steps.verify.outputs.tag_exists != 'true'
        env:
          EXPECTED_SHA: ${{ inputs.main_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG_DEPLOY_KEY: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}
        run: |
          RELEASE_TAG="v${EXPECTED_VERSION}"
          git fetch origin main
          bash .github/scripts/release-promotion-state.sh \
            require-current-main "$EXPECTED_SHA" refs/remotes/origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "TokenSupply $RELEASE_TAG"
          KEY_PATH="$RUNNER_TEMP/release-tag-deploy-key"
          KNOWN_HOSTS_PATH="$RUNNER_TEMP/release-tag-known-hosts"
          install -m 600 /dev/null "$KEY_PATH"
          printf '%s\n' "$RELEASE_TAG_DEPLOY_KEY" > "$KEY_PATH"
          ssh-keyscan -t ed25519 github.com > "$KNOWN_HOSTS_PATH"
          GIT_SSH_COMMAND="ssh -i $KEY_PATH -o IdentitiesOnly=yes -o UserKnownHostsFile=$KNOWN_HOSTS_PATH -o StrictHostKeyChecking=yes" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}"

  release:
    needs: promote
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ inputs.version }}
      candidate_run_id: ${{ needs.promote.outputs.candidate_run_id }}
      candidate_commit: ${{ inputs.main_sha }}
    secrets: inherit
